services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rpg-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      APP_ENV: local
      APP_DEBUG: true
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: rpg
      DB_USERNAME: rpg
      DB_PASSWORD: rpgsecret
      MAIL_MAILER: smtp
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_USERNAME: null
      MAIL_PASSWORD: null
      MAIL_ENCRYPTION: null
    # `public/storage` is created as a *relative* symlink (instead of via
    # `php artisan storage:link`, which defaults to an absolute path) so it
    # resolves correctly both inside this container (/var/www) and, since the
    # project directory is bind-mounted, from the host filesystem too.
    command: >
      bash -c "composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
      && npm install --no-fund --no-audit
      && npm run build
      && php artisan key:generate --force
      && php artisan migrate --force --seed
      && rm -f public/storage && ln -s ../storage/app/public public/storage
      && php artisan serve --host=0.0.0.0 --port=8000"

  db:
    image: postgres:16-alpine
    container_name: rpg-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: rpg
      POSTGRES_USER: rpg
      POSTGRES_PASSWORD: rpgsecret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpg -d rpg"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mailhog:
    image: mailhog/mailhog:latest
    container_name: rpg-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP server (used by the app to send e-mails)
      - "8025:8025" # Web UI (browse the e-mails sent by the app)

volumes:
  postgres_data:
